name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: arabs-guard-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  android-api-smoke:
    name: Android API ${{ matrix.api-level }} smoke test
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        api-level: [24, 26, 29, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arabs-guard-debug-apk
          path: artifacts
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 5X
          disk-size: 2048M
          heap-size: 256M
          disable-animations: true
          script: |
            set -eu
            package_name="com.arabsguard.arabs_guard"
            activity_name="$package_name/.MainActivity"

            # Avoid the emulator's very slow streamed-install path on some
            # hosted API images (notably API 31+).
            adb install --no-streaming -r artifacts/app-debug.apk

            package_ready=false
            for attempt in $(seq 1 12); do
              if adb shell pm path "$package_name" | grep -q '^package:'; then
                package_ready=true
                break
              fi
              sleep 5
            done
            test "$package_ready" = true

            adb shell am start -n "$activity_name"

            activity_ready=false
            for attempt in $(seq 1 18); do
              if adb shell dumpsys activity activities | grep -Fq "$activity_name"; then
                activity_ready=true
                break
              fi
              sleep 5
            done
            test "$activity_ready" = true
