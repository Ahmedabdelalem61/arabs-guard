name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: arabs-guard-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  android-api-smoke:
    name: Android API ${{ matrix.api-level }} smoke test
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        api-level: [24, 26, 29, 31, 33, 34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arabs-guard-debug-apk
          path: artifacts
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: Nexus 5X
          disk-size: 2048M
          heap-size: 256M
          disable-animations: true
          script: |
            adb install artifacts/app-debug.apk
            adb shell am start -W -n com.arabsguard.arabs_guard/.MainActivity
            adb shell dumpsys package com.arabsguard.arabs_guard | grep -q "minSdk=24"
            adb shell dumpsys activity activities | grep -q "com.arabsguard.arabs_guard/.MainActivity"
