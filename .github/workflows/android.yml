name: Android checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: arabs-guard-smoke-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  android-api-smoke:
    name: Android API ${{ matrix.api-level }} smoke test
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        api-level: [24, 26, 29, 31, 33, 34, 35, 36]
        include:
          - api-level: 35
            target: default
            ram_size: 4096M
            heap_size: 512M
            disk_size: 4096M
            boot_timeout: 1800
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arabs-guard-smoke-apk
          path: artifacts
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target || 'google_apis' }}
          profile: Nexus 5X
          ram-size: ${{ matrix.ram_size || '2048M' }}
          disk-size: ${{ matrix.disk_size || '2048M' }}
          heap-size: ${{ matrix.heap_size || '256M' }}
          emulator-boot-timeout: ${{ matrix.boot_timeout || 600 }}
          disable-animations: true
          script: bash .github/scripts/android-smoke.sh artifacts/app-release.apk
