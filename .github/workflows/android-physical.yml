name: Android physical-device certification

on:
  workflow_dispatch:
    inputs:
      api:
        description: Exact API connected to the android-physical self-hosted runner
        required: true
        default: '37'
        type: string
      confirm_app_data_reset:
        description: Certification uninstalls Arabs Guard and erases its existing app data on the attached device
        required: true
        default: not-confirmed
        type: choice
        options:
          - not-confirmed
          - RESET-ARABS-GUARD
      confirm_read_only_router_probe:
        description: Authorize credential-free TCP reachability checks to the attached device's private gateway
        required: true
        default: not-confirmed
        type: choice
        options:
          - not-confirmed
          - READ-ONLY-ROUTER-PROBE

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate destructive and network confirmations
        env:
          RESET_CONFIRMATION: ${{ inputs.confirm_app_data_reset }}
          ROUTER_PROBE_CONFIRMATION: ${{ inputs.confirm_read_only_router_probe }}
        run: |
          test "$RESET_CONFIRMATION" = RESET-ARABS-GUARD
          test "$ROUTER_PROBE_CONFIRMATION" = READ-ONLY-ROUTER-PROBE
      - uses: actions/checkout@v4
      - name: Verify no-download physical certification contract
        run: bash .github/scripts/verify-physical-certification.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install Android 17 compile SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" 'platforms;android-37.0' 'build-tools;37.0.0' >/dev/null
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testReleaseUnitTest
        working-directory: android
      - run: flutter build apk --release
      - run: ./gradlew :app:assembleReleaseAndroidTest
        working-directory: android
      - name: Verify packaged Android runtimes
        run: bash .github/scripts/verify-android-artifacts.sh
      - name: Stage physical-certification APKs
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/app-release.apk
          cp build/app/outputs/apk/androidTest/release/app-release-androidTest.apk artifacts/app-release-androidTest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: physical-certification-apks
          path: artifacts/*.apk
          retention-days: 1

  physical-api:
    needs: build
    runs-on: [self-hosted, linux, android-physical]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: physical-certification-apks
          path: artifacts
      - name: Certify attached physical Android device
        env:
          ANDROID_PHYSICAL_RESET_CONFIRMED: ${{ inputs.confirm_app_data_reset }}
          ANDROID_PHYSICAL_ROUTER_PROBE_CONFIRMED: ${{ inputs.confirm_read_only_router_probe }}
        run: >-
          bash .github/scripts/android-physical-smoke.sh
          artifacts/app-release.apk
          artifacts/app-release-androidTest.apk
          '${{ inputs.api }}'
      - name: Upload physical-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ inputs.api }}-physical-evidence
          path: test-results/api-${{ inputs.api }}
          if-no-files-found: warn
          retention-days: 7
