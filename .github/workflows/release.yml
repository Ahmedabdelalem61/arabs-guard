name: Android prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - name: Stage release files
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/arabs-guard-1.0.0-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/arabs-guard-1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/arabs-guard-1.0.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/arabs-guard-1.0.0-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/arabs-guard-1.0.0.aab
          gh release download v1.0.0-alpha.1 --pattern arabs-guard-demo-android17.mp4 --dir artifacts
          sha256sum artifacts/*.apk artifacts/*.aab artifacts/*.mp4 > artifacts/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --prerelease \
            --title "Arabs Guard ${GITHUB_REF_NAME#v}" \
            --notes "Evaluation prerelease for Android 7.0+ (API 24+) through current Android. Includes router gateway auto-detection, firmware fingerprinting, universal and per-ABI APKs, an AAB, checksums, and a simulated Android 17 demo. Router writes remain enabled only for validated firmware. Evaluation artifacts use Android debug signing; configure a production upload key before Play Store submission."
        env:
          GH_TOKEN: ${{ github.token }}
