name: Android prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Install Android 17 compile SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" 'platforms;android-37.0' 'build-tools;37.0.0' >/dev/null
      - run: flutter analyze
      - run: flutter test
      - run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - run: flutter build apk --release
      - run: flutter build apk --release --split-per-abi
      - run: flutter build appbundle --release
      - run: ./gradlew :app:assembleReleaseAndroidTest
        working-directory: android
      - name: Verify packaged Android runtimes and 16 KB alignment
        run: |
          bash .github/scripts/verify-android-artifacts.sh
          zipalign_bin="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name zipalign -print | sort -V | tail -1)"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            "$zipalign_bin" -c -P 16 4 "$apk"
          done
      - name: Stage release files
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/arabs-guard-1.0.0-universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/arabs-guard-1.0.0-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/arabs-guard-1.0.0-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/arabs-guard-1.0.0-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/arabs-guard-1.0.0.aab
          gh release download v1.0.0-alpha.2 --pattern arabs-guard-demo-android17.mp4 --dir artifacts
          mv artifacts/arabs-guard-demo-android17.mp4 artifacts/arabs-guard-demo-mode.mp4
          sha256sum artifacts/*.apk artifacts/*.aab artifacts/*.mp4 > artifacts/SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish prerelease
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --prerelease \
            --title "Arabs Guard ${GITHUB_REF_NAME#v}" \
            --notes "Evaluation prerelease targeting Android 17/API 37 for Android 7.0+ devices, with hosted runtime tests passing on APIs 24 through 36. Includes explicit Android 17 local-network consent, router gateway auto-detection, firmware fingerprinting, universal and per-ABI APKs, an AAB, SHA-256 checksums, 16 KB-alignment validation, and a safe simulated demo. API 37 physical-device runtime certification remains pending because its emulator image cannot boot reliably on GitHub's standard hosted runners. Router writes remain enabled only for a validated structural firmware contract. Evaluation artifacts use Android debug signing; configure a production upload key before Play Store submission."
        env:
          GH_TOKEN: ${{ github.token }}
